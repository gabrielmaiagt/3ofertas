              "meta": "6 giradores, do fácil ao elaborado",
              "html": "<p>Receitas escritas dos giradores, da mais simples à mais elaborada. Leia a receita inteira antes de começar e faça a primeira peça com fio médio, que é mais fácil de ver os pontos.</p><h3>1. Espiral clássica (cacho)</h3><p><strong>Fio médio, agulha 3,5 mm. Tamanho final: cerca de 35 cm.</strong> É o girador mais fácil e o mais vendido.</p><div class=\"row\">Base: 90 corr.</div><div class=\"row\">Carreira 1: 1 pa na 4ª corr a partir da agulha. 2 pa em cada corr até o fim.</div><div class=\"row\">Carreira 2: 3 corr, vire. 2 pa em cada ponto até o fim.</div><p>A peça vai enrolar sozinha em espiral. Arremate deixando 20 cm de fio na ponta de cima para pendurar.</p><h3>2. Espiral bicolor</h3><p>Faça a espiral clássica e, na carreira 2, troque de cor. Para três cores, faça uma 3ª carreira com 1 pb em cada ponto na terceira cor. A borda colorida destaca o giro.</p><h3>3. Girador de corações</h3><p><strong>Fio fino, agulha 2,5 mm.</strong> Faça 5 corações (vermelho, rosa, laranja, lilás e branco).</p><div class=\"row\">Coração: AM. 4 corr, 3 pad, 4 pa, 1 corr, 1 pad, 1 corr, 4 pa, 3 pad, 4 corr, 1 pbx no AM. Puxe o fio para fechar.</div><p>Monte na linha de nylon, alternando cada coração com 3 miçangas. Prenda uma espiral clássica fina (60 corr) no centro de cima para baixo para dar movimento.</p><h3>4. Girador de flores (girassol)</h3><div class=\"row\">Miolo marrom: AM com 10 pb. Feche com pbx.</div><div class=\"row\">Pétalas amarelas: (4 corr, 1 pa na 2ª corr, 1 pa na seguinte, 1 pb na última, 1 pbx no próximo ponto do miolo) ×10.</div><p>Faça 4 girassóis e 6 folhas verdes (6 corr, 1 pb, 1 pma, 2 pa, 1 pma, 1 pb ao longo da corrente; repita do outro lado). Costure sobre uma espiral clássica verde, de cima para baixo.</p><h3>5. Girador de borboletas</h3><div class=\"row\">Borboleta: AM. (4 corr, 3 pad, 4 corr, 1 pbx no AM) ×2 para as asas de cima. (3 corr, 3 pa, 3 corr, 1 pbx no AM) ×2 para as asas de baixo. Puxe o fio para fechar.</div><p>Enrole um fio preto no centro, de cima para baixo, para formar o corpo, e deixe 2 pontas como antenas. Faça 4 borboletas em tons degradê e monte na linha de nylon com miçangas entre elas.</p><h3>6. Espiral larga em degradê</h3><p><strong>Fio médio, agulha 3,5 mm.</strong> Siga a espiral clássica com 120 corr de base e 3 carreiras, mudando de cor a cada carreira (do escuro para o claro). Fica mais cheia e chama atenção na varanda.</p><div class=\"tip\"><strong>Dica:</strong> para o giro ficar uniforme, mantenha a mesma tensão do fio do começo ao fim. Se a espiral ficar torta, molhe, estique e deixe secar pendurada.</div>"

a. (3 corr, 3 pa, 3 corr, 1 pbx no AM) ×2 para as asas de baixo. Puxe o fio para fechar.</div><p>Enrole um fio preto no centro, de cima para baixo, para formar o corpo, e deixe 2 pontas como antenas. Faça 4 borboletas em tons degradê e monte na linha de nylon com miçangas entre elas.</p><h3>6. Espiral larga em degradê</h3><p><strong>Fio médio, agulha 3,5 mm.</strong> Siga a espiral clássica com 120 corr de base e 3 carreiras, mudando de cor a cada carreira (do escuro para o claro). Fica mais cheia e chama atenção na varanda.</p><div class=\"tip\"><strong>Dica:</strong> para o giro ficar uniforme, mantenha a mesma tensão do fio do começo ao fim. Se a espiral ficar torta, molhe, estique e deixe secar pendurada.</div>"

              "url": "",
              "html": "<p>O acabamento faz o girador girar bonito e durar mais.</p><h3>Endurecer</h3><ol><li>Misture cola branca e água em partes iguais.</li><li>Mergulhe a peça, retire o excesso com as mãos sem torcer.</li><li>Pendure com um peso leve na ponta (uma miçanga grande ou um prendedor) para a espiral secar alinhada.</li><li>Deixe secar por 24 horas, longe do sol direto.</li></ol><h3>Montar o giro</h3><ol><li>Amarre a ponta de cima da peça na argola inferior do destorcedor giratório.</li><li>Na argola de cima do destorcedor, prenda 20 a 30 cm de linha de nylon.</li><li>Faça um laço na outra ponta da linha para pendurar no gancho.</li><li>Se quiser, coloque uma conta de madeira acima do destorcedor para esconder a peça de metal.</li></ol><h3>Peso na ponta</h3><p>Uma miçanga, um pingente ou um pequeno pompom na ponta de baixo ajuda a peça a ficar esticada e girar com o vento sem enroscar.</p><h3>Cuidados para passar para a cliente</h3><ul><li>Uso interno ou em varanda coberta: o sol forte desbota as cores.</li><li>Para limpar, lave à mão com sabão neutro e seque pendurado.</li></ul>"
