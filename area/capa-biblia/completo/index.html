              "id": "c-moldes",
              "type": "pdf",
              "title": "Moldes: bolso, média, grande e letra gigante",
              "url": "",
              "html": "<p>Todos os modelos usam a mesma construção: um <strong>corpo</strong> que envolve frente, lombada e verso, e uma <strong>faixa com zíper</strong> que contorna os três lados abertos. Abaixo estão os cortes prontos para os 4 tamanhos mais comuns e a fórmula para qualquer Bíblia.</p><h3>1. Meça a sua Bíblia</h3><ul><li><strong>L</strong> = largura da capa (de lado a lado da frente).</li><li><strong>A</strong> = altura.</li><li><strong>E</strong> = espessura (lombada) com a Bíblia fechada.</li></ul><h3>2. Medidas prontas (em cm)</h3><p>Os tamanhos de referência são aproximados. Sempre confira com a Bíblia da cliente.</p><table><thead><tr><th>Tamanho</th><th>Bíblia (L × A × E)</th><th>Corpo: tecido e forro</th><th>Corpo: manta</th></tr></thead><tbody><tr><td>Bolso</td><td>9,5 × 14 × 2,5</td><td>25,5 × 18</td><td>23,5 × 16</td></tr><tr><td>Média</td><td>14 × 21 × 3,5</td><td>35,5 × 25</td><td>33,5 × 23</td></tr><tr><td>Grande</td><td>16 × 23 × 4,5</td><td>40,5 × 27</td><td>38,5 × 25</td></tr><tr><td>Letra gigante</td><td>19 × 27 × 5,5</td><td>47,5 × 31</td><td>45,5 × 29</td></tr></tbody></table><table><thead><tr><th>Tamanho</th><th>Faixa do zíper: 4 tiras (2 de tecido, 2 de forro)</th><th>Zíper no metro</th></tr></thead><tbody><tr><td>Bolso</td><td>3,2 × 37</td><td>41 cm</td></tr><tr><td>Média</td><td>3,8 × 53</td><td>57 cm</td></tr><tr><td>Grande</td><td>4,2 × 59</td><td>63 cm</td></tr><tr><td>Letra gigante</td><td>4,8 × 69</td><td>73 cm</td></tr></tbody></table><h3>3. Fórmula para qualquer tamanho</h3><table><thead><tr><th>Peça</th><th>Largura</th><th>Altura ou comprimento</th></tr></thead><tbody><tr><td>Corpo (tecido e forro)</td><td>2L + E + 4</td><td>A + 4</td></tr><tr><td>Corpo (manta)</td><td>2L + E + 2</td><td>A + 2</td></tr><tr><td>Tira da faixa (×2 tecido, ×2 forro)</td><td>E ÷ 2 + 2</td><td>2L + A + 4</td></tr><tr><td>Zíper</td><td>—</td><td>2L + A + 8</td></tr><tr><td>Alça (opcional)</td><td>6</td><td>40 (vira 1,5 × 38)</td></tr></tbody></table><p>As medidas já incluem 1 cm de folga para a Bíblia entrar com facilidade e 1 cm de costura em cada lado.</p><div class=\"tip\"><strong>Dica:</strong> faça a primeira capa de cada tamanho num tecido barato. Se ficar justa, aumente 0,5 cm na folga e anote no seu molde.</div>"
            },

              "title": "Passo a passo com fotos",
              "url": "",
              "html": "<p>Passo a passo do modelo base com zíper. Todos os 50 modelos seguem esta sequência; o que muda são o tecido, os bolsos, a alça e a personalização.</p><h3>Corte</h3><ol><li>Corte o corpo no tecido de fora, no forro e na manta, conforme a tabela de moldes.</li><li>Corte as 4 tiras da faixa: 2 no tecido de fora e 2 no forro.</li><li>Corte o zíper no tamanho indicado e coloque o cursor.</li></ol><h3>Corpo acolchoado</h3><ol><li>Centralize a manta no avesso do tecido de fora, deixando 1 cm livre em toda a volta.</li><li>Prenda com alfinetes e costure linhas retas a cada 3 cm (matelassê) ou só o contorno, a 0,5 cm da borda da manta.</li><li>Se o modelo tiver personalização na frente (nome, cruz, aplique), faça agora, antes de montar.</li></ol><h3>Faixa com zíper</h3><ol><li>Coloque uma tira de tecido direito com direito sobre o zíper e, por baixo, uma tira de forro. Costure com o calcador de zíper.</li><li>Vire as tiras, passe a ferro e pesponte a 0,3 cm do zíper.</li><li>Repita do outro lado do zíper. Agora você tem uma faixa única com o zíper no meio.</li></ol><h3>Montagem</h3><ol><li>Marque no corpo o centro da lombada e os dois cantos de cada lado.</li><li>Prenda a faixa no contorno de um lado do corpo (topo, lateral e base da frente), direito com direito. Nos cantos, faça um pique de 0,8 cm na faixa para ela virar sem franzir.</li><li>Costure a 1 cm da borda. Repita do outro lado do corpo (verso).</li><li>Abra o zíper até a metade antes de fechar a última costura. Assim você consegue desvirar a capa.</li><li>Costure o forro do corpo do mesmo jeito, deixando uma abertura de 8 cm na lombada.</li><li>Encaixe as duas partes, desvire pela abertura e feche a abertura à mão ou com pesponto rente.</li></ol><h3>Alça (opcional)</h3><ol><li>Corte uma tira de 6 × 40 cm e passe entretela.</li><li>Dobre as bordas até o centro, dobre ao meio e pesponte dos dois lados (fica com 1,5 cm).</li><li>Prenda as pontas na lombada, a 4 cm do topo e da base, antes de montar o corpo.</li></ol><h3>Acabamento</h3><ul><li>Passe a capa inteira a ferro, com um pano por cima.</li><li>Corte as linhas soltas e confira se o zíper corre sem enroscar.</li><li>Coloque a Bíblia para conferir. Esse é o momento de tirar a foto para o catálogo.</li></ul><div class=\"tip\"><strong>Dica:</strong> costure o zíper sempre com o calcador de zíper e devagar nos cantos. É a parte que mais define o acabamento.</div>"

              "title": "Bíblia Encapada Sem Costura",
              "url": "",
              "html": "<p>Para quem não tem máquina ou quer uma opção mais rápida: uma <strong>capa rígida removível</strong> feita com papelão, tecido e cola. A Bíblia encaixa por dentro e a capa pode ser retirada.</p><h3>Materiais</h3><ul><li>Papelão cinza rígido de 1,5 a 2 mm (papelão para cartonagem).</li><li>Tecido de algodão (tricoline ou linho) e um tecido ou papel para o interior.</li><li>Cola branca extra forte (PVA), pincel chato e espátula ou cartão velho.</li><li>Estilete, régua de metal e base de corte.</li><li>Elástico de 1 cm ou 2 fitas para prender a Bíblia.</li></ul><h3>Cortes</h3><table><thead><tr><th>Peça</th><th>Medida</th></tr></thead><tbody><tr><td>Placa da frente e do verso (2×)</td><td>(L + 0,5) × (A + 1)</td></tr><tr><td>Lombada (1×)</td><td>(E + 0,4) × (A + 1)</td></tr><tr><td>Tecido de fora</td><td>placas montadas com 0,5 cm entre elas + 2 cm de margem em toda a volta</td></tr><tr><td>Interior</td><td>1 cm menor que a capa aberta</td></tr></tbody></table><h3>Montagem</h3><ol><li>Passe cola fina no avesso do tecido, sem encharcar.</li><li>Posicione as placas: frente, lombada e verso, com 0,5 cm de espaço entre elas. Esse espaço é a dobradiça.</li><li>Alise com a espátula do centro para fora, tirando as bolhas.</li><li>Corte os cantos do tecido em diagonal, a 0,3 cm da placa.</li><li>Dobre e cole as margens: primeiro as de cima e de baixo, depois as laterais.</li><li>Passe o elástico ou as fitas por dentro, colando as pontas sob o interior.</li><li>Cole o interior cobrindo as margens e deixe secar fechada, com um peso por cima, por 12 horas.</li></ol><h3>15 modelos</h3><ol><li>Floral rosa com fita de cetim</li><li>Linho cru com cruz de juta</li><li>Xadrez vermelho com elástico</li><li>Jeans com etiqueta de couro</li><li>Tricoline de estrelas infantil</li><li>Linho com nome em vinil</li><li>Floral azul com renda</li><li>Preto com cantoneiras douradas</li><li>Lavanda com laço</li><li>Girassol com botão de madeira</li><li>Marinho com faixa listrada</li><li>Branco de casamento com pérolas</li><li>Verde-oliva com folhas</li><li>Rosé com iniciais</li><li>Dupla face com aba e fecho de imã</li></ol><div class=\"tip\"><strong>Dica:</strong> use pouca cola e sempre espalhada. Cola demais atravessa o tecido e mancha.</div>"

              "url": "",
              "html": "<p>A personalização é o que faz a cliente pagar mais. Escolha a técnica pelo equipamento que você tem.</p><h3>Aplique com termocolante</h3><ol><li>Desenhe a letra ou figura espelhada no papel do termocolante.</li><li>Passe a ferro no avesso do tecido do aplique e recorte.</li><li>Tire o papel, posicione na capa e passe a ferro.</li><li>Contorne com ponto zigue-zague curto na máquina.</li></ol><h3>Bordado à máquina</h3><p>Se você tem máquina de bordar, use letras cursivas de 3 a 4 cm de altura e entretela de recorte por baixo do tecido.</p><h3>Pintura em tecido</h3><p>Use estêncil de letras e tinta para tecido. Fixe a tinta passando a ferro pelo avesso depois de 24 horas.</p><h3>Letras termocolantes de vinil têxtil</h3><p>Corte as letras em vinil têxtil (à mão ou em plotter) e aplique com ferro bem quente, sem vapor, pressionando por 15 segundos.</p><h3>Ideias de personalização</h3><ul><li>Nome completo ou só o primeiro nome.</li><li>Iniciais com uma cruz pequena.</li><li>Nome do casal e data, para presente de casamento.</li><li>Nome e data do batismo ou da primeira eucaristia.</li><li>Uma referência bíblica escolhida pela cliente (por exemplo Salmos 23, Filipenses 4.13, Josué 1.9, Provérbios 3.5 ou João 3.16). Peça que ela escolha também a tradução preferida.</li></ul><div class=\"tip\"><strong>Dica:</strong> cobre a personalização à parte, por letra ou por item. Assim o preço base continua competitivo.</div>"
