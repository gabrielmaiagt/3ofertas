              "meta": "Leitura",
              "html": "<p>Bolsa porta-Bíblia com alça transversal, para levar Bíblia, caderno e caneta. Use os mesmos tecidos das capas.</p><h3>Cortes (para Bíblia média)</h3><table><thead><tr><th>Peça</th><th>Quantidade</th><th>Medida</th></tr></thead><tbody><tr><td>Frente e verso (tecido de fora)</td><td>2</td><td>26 × 32 cm</td></tr><tr><td>Frente e verso (forro)</td><td>2</td><td>26 × 32 cm</td></tr><tr><td>Manta</td><td>2</td><td>24 × 30 cm</td></tr><tr><td>Bolso externo</td><td>1</td><td>20 × 16 cm (dobrado: 20 × 8)</td></tr><tr><td>Alça</td><td>1</td><td>6 × 120 cm</td></tr><tr><td>Zíper</td><td>1</td><td>26 cm</td></tr></tbody></table><h3>Montagem</h3><ol><li>Acolchoe frente e verso com a manta.</li><li>Dobre o bolso ao meio, pesponte a dobra e costure na frente, a 8 cm da base. Divida em 3 com costuras verticais (celular, caneta e marca-texto).</li><li>Costure o zíper entre o tecido de fora e o forro, na boca da bolsa, dos dois lados.</li><li>Abra o zíper, una frente e verso direito com direito, e o forro com o forro, deixando 10 cm abertos no forro.</li><li>Faça os cantos da base: costure um triângulo de 3 cm em cada canto para a bolsa ficar com fundo.</li><li>Desvire, feche o forro e prenda a alça nas laterais.</li></ol><p>Para outros tamanhos, use a medida da Bíblia: largura + 10 cm e altura + 9 cm.</p>"
