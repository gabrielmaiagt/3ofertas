              "meta": "Leitura",
              "html": "<p>Boné de crochê com copa redonda e aba firme. Tamanho adulto P/M (circunferência de 54 a 56 cm). Fio de algodão médio, agulha 3,5 mm.</p><h3>Abreviações</h3><table><thead><tr><th>Sigla</th><th>Ponto</th></tr></thead><tbody><tr><td>corr</td><td>corrente</td></tr><tr><td>pbx</td><td>ponto baixíssimo</td></tr><tr><td>pb</td><td>ponto baixo</td></tr><tr><td>pma</td><td>ponto meio alto</td></tr><tr><td>pa</td><td>ponto alto</td></tr><tr><td>pad</td><td>ponto alto duplo</td></tr><tr><td>aum</td><td>aumento: 2 pontos no mesmo ponto</td></tr><tr><td>dim</td><td>diminuição: 2 pontos fechados juntos</td></tr><tr><td>AM</td><td>anel mágico</td></tr><tr><td>( ) ×n</td><td>repita o que está entre parênteses n vezes</td></tr></tbody></table><h3>Copa</h3><div class=\"row\">C1: AM com 8 pb (8)</div><div class=\"row\">C2: aum em todos (16)</div><div class=\"row\">C3: (1 pb, aum) ×8 (24)</div><div class=\"row\">C4: (2 pb, aum) ×8 (32)</div><div class=\"row\">C5: (3 pb, aum) ×8 (40)</div><div class=\"row\">C6 a C11: continue aumentando 8 pontos por carreira até ter 88 pontos (cerca de 17 cm de diâmetro).</div><div class=\"row\">C12 a C27: 1 pb em cada ponto (88). A copa fica com cerca de 17 cm de altura.</div><h3>Aba</h3><div class=\"row\">Trabalhe só em 30 pontos da frente. Carreira 1: 1 pb em cada ponto. Carreiras 2 a 8: pule o 1º ponto e faça pb até o penúltimo, diminuindo 1 ponto em cada ponta.</div><div class=\"row\">Contorno: 1 carreira de pb em volta de toda a aba e da borda do boné.</div><p>Para a aba ficar firme, costure por dentro um pedaço de plástico flexível (de pasta de arquivo) recortado no formato da aba.</p><h3>Variações</h3><ul><li>Boné com flores aplicadas na copa.</li><li>Boné listrado: troque de cor a cada 4 carreiras.</li><li>Viseira: faça só as carreiras C12 a C15 em tira e a aba, com um elástico atrás.</li></ul><div class=\"tip\"><strong>Dica:</strong> meça a cabeça da cliente. Para cada 2 cm a mais de circunferência, aumente 4 pontos na copa.</div>"
