              "html": "<p>Caixinha com cartões de promessas para tirar um por dia. Vende muito como lembrancinha e presente.</p><h3>Materiais</h3><ul><li>Caixa de MDF ou papelão de 10 × 7 × 5 cm</li><li>Tecido ou papel decorado para forrar</li><li>Papel cartão 180 g para os cartões</li><li>Cola branca, fita de cetim e etiqueta</li></ul><h3>Montagem</h3><ol><li>Forre a caixa com tecido e cola branca, como na capa sem costura.</li><li>Corte 60 cartões de 9 × 6 cm.</li><li>Escreva ou imprima em cada cartão um tema e uma referência bíblica. Peça à cliente a tradução preferida para escrever o texto completo.</li><li>Arrume os cartões na caixa, feche com a fita e cole a etiqueta (\"Caixinha de Promessas\" ou o nome de quem vai receber).</li></ol><h3>60 sugestões de cartões (tema e referência)</h3><table><thead><tr><th>Tema</th><th>Referências</th></tr></thead><tbody><tr><td>Confiança</td><td>Provérbios 3.5-6, Jeremias 29.11, Isaías 26.3</td></tr><tr><td>Paz</td><td>Filipenses 4.6-7, João 14.27, Salmos 4.8</td></tr><tr><td>Força</td><td>Filipenses 4.13, Isaías 40.31, Salmos 46.1</td></tr><tr><td>Coragem</td><td>Josué 1.9, Deuteronômio 31.6, Salmos 27.1</td></tr><tr><td>Amor</td><td>1 Coríntios 13.4-7, João 3.16, 1 João 4.19</td></tr><tr><td>Esperança</td><td>Romanos 15.13, Lamentações 3.22-23, Salmos 42.11</td></tr><tr><td>Gratidão</td><td>1 Tessalonicenses 5.18, Salmos 100.4, Colossenses 3.15</td></tr><tr><td>Alegria</td><td>Neemias 8.10, Salmos 16.11, Filipenses 4.4</td></tr><tr><td>Perdão</td><td>Efésios 4.32, Colossenses 3.13, 1 João 1.9</td></tr><tr><td>Fé</td><td>Hebreus 11.1, Marcos 11.24, Romanos 10.17</td></tr><tr><td>Proteção</td><td>Salmos 91.1-2, Salmos 121.7-8, 2 Tessalonicenses 3.3</td></tr><tr><td>Sabedoria</td><td>Tiago 1.5, Provérbios 2.6, Salmos 90.12</td></tr><tr><td>Família</td><td>Josué 24.15, Salmos 127.1, Efésios 6.1-4</td></tr><tr><td>Descanso</td><td>Mateus 11.28, Salmos 23.1-3, Êxodo 33.14</td></tr><tr><td>Provisão</td><td>Filipenses 4.19, Mateus
