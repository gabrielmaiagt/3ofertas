              "html": "<p>Caminho de mesa com folhas de outono unidas. Com 24 folhas você faz um caminho de cerca de 1,20 m.</p><h3>Abreviações</h3><table><thead><tr><th>Sigla</th><th>Ponto</th></tr></thead><tbody><tr><td>corr</td><td>corrente</td></tr><tr><td>pbx</td><td>ponto baixíssimo</td></tr><tr><td>pb</td><td>ponto baixo</td></tr><tr><td>pma</td><td>ponto meio alto</td></tr><tr><td>pa</td><td>ponto alto</td></tr><tr><td>pad</td><td>ponto alto duplo</td></tr><tr><td>aum</td><td>aumento: 2 pontos no mesmo ponto</td></tr><tr><td>dim</td><td>diminuição: 2 pontos fechados juntos</td></tr><tr><td>AM</td><td>anel mágico</td></tr><tr><td>( ) ×n</td><td>repita o que está entre parênteses n vezes</td></tr></tbody></table><h3>Folha</h3><div class=\"row\">15 corr. Volte pela corrente: 1 pbx, 1 pb, 1 pma, 2 pa, 2 pad, 2 pa, 1 pma, 1 pb, 1 pbx; na ponta, 3 corr. Repita do outro lado da corrente. Feche com pbx.</div><div class=\"row\">Contorno: 1 carreira de pb em volta da folha, com 3 pb no bico.</div><h3>Cores</h3><p>Alterne mostarda, terracota, vinho, caramelo e verde-oliva.</p><h3>Montagem</h3><ol><li>Passe as folhas a ferro com um pano úmido por cima para ficarem planas.</li><li>Distribua as folhas sobre a mesa em duas fileiras desencontradas.</li><li>Una as folhas com alguns pontos nos lugares onde elas se tocam.</li><li>Opcional: faça 10 bolotas (bolinha da área do girador até a C2, 2 carreiras retas) em marrom e costure entre as folhas.</li></ol>"
