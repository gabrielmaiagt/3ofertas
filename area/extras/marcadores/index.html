              "html": "<p>Cinco modelos de marcador de página para vender junto com as capas.</p><h3>1. Fitas na lombada</h3><p>Três fitas de cetim de 3 mm com 35 cm, presas numa ponteira e com um pingente na ponta (cruz, coração ou pomba). Ficam presas na lombada da capa.</p><h3>2. Marcador de tecido</h3><p>Retângulo de tricoline de 6 × 20 cm com entretela, costurado direito com direito, desvirado e pespontado. Finalize com um pompom ou borla.</p><h3>3. Marcador de canto</h3><p>Triângulo de tecido de 8 cm de lado, com bolso em ângulo, que encaixa no canto da página.</p><h3>4. Marcador magnético</h3><p>Papel cartão dobrado com dois ímãs finos dentro e capa de tecido colada. Prende a página dos dois lados.</p><h3>5. Marcador com nome</h3><p>Qualquer um dos modelos acima com o nome aplicado ou uma referência bíblica escolhida pela cliente.</p><div class=\"tip\"><strong>Dica:</strong> vende muito em kit com a capa. Use as sobras de tecido das capas e o custo fica quase zero.</div>"
