              "meta": "Leitura",
              "html": "<p>Cinco modelos de pulseira entre os mais vendidos. Linha fina de algodão, agulha 1,75 a 2,0 mm.</p><h3>Abreviações</h3><table><thead><tr><th>Sigla</th><th>Ponto</th></tr></thead><tbody><tr><td>corr</td><td>corrente</td></tr><tr><td>pbx</td><td>ponto baixíssimo</td></tr><tr><td>pb</td><td>ponto baixo</td></tr><tr><td>pma</td><td>ponto meio alto</td></tr><tr><td>pa</td><td>ponto alto</td></tr><tr><td>pad</td><td>ponto alto duplo</td></tr><tr><td>aum</td><td>aumento: 2 pontos no mesmo ponto</td></tr><tr><td>dim</td><td>diminuição: 2 pontos fechados juntos</td></tr><tr><td>AM</td><td>anel mágico</td></tr><tr><td>( ) ×n</td><td>repita o que está entre parênteses n vezes</td></tr></tbody></table><h3>1. Pulseira de correntinha com miçangas</h3><p>Passe 30 miçangas na linha antes de começar. Faça corrente, puxando uma miçanga a cada 3 corr, até 17 cm. Feche com fecho de lagosta.</p><h3>2. Pulseira de pb</h3><div class=\"row\">40 corr (cerca de 17 cm). Carreiras 1 a 3: 1 pb em cada ponto. Costure botão numa ponta e faça uma alça de 6 corr na outra.</div><h3>3. Pulseira com flor</h3><p>Faça a pulseira de pb e costure no centro uma florzinha (receita do brinco de flor, na área do girador).</p><h3>4. Pulseira de leque</h3><div class=\"row\">Base: 41 corr. Carreira 1: 1 pb na 2ª corr, (pule 2 corr, 5 pa na seguinte, pule 2 corr, 1 pb) até o fim. Fecho com botão.</div><h3>5. Pulseira de amizade em dupla</h3><p>Faça duas pulseiras de correntinha em cores trocadas e venda em par, em cartão com o nome das duas.</p><div class=\"tip\"><strong>Dica:</strong> pulseiras vendem bem em kit de 3 e como lembrancinha. Embale em cartão com furo.</div>"
