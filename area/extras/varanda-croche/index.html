              "title": "Mandala de parede",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Mandala de parede em crochê, montada num aro de madeira ou metal. Fio médio, agulha 3,0 mm. Diâmetro final: 25 cm.</p><h3>Abreviações</h3><table><thead><tr><th>Sigla</th><th>Ponto</th></tr></thead><tbody><tr><td>corr</td><td>corrente</td></tr><tr><td>pbx</td><td>ponto baixíssimo</td></tr><tr><td>pb</td><td>ponto baixo</td></tr><tr><td>pma</td><td>ponto meio alto</td></tr><tr><td>pa</td><td>ponto alto</td></tr><tr><td>pad</td><td>ponto alto duplo</td></tr><tr><td>aum</td><td>aumento: 2 pontos no mesmo ponto</td></tr><tr><td>dim</td><td>diminuição: 2 pontos fechados juntos</td></tr><tr><td>AM</td><td>anel mágico</td></tr><tr><td>( ) ×n</td><td>repita o que está entre parênteses n vezes</td></tr></tbody></table><div class=\"row\">C1: AM. 3 corr (vale 1 pa), 11 pa no anel. Feche com pbx (12).</div><div class=\"row\">C2: 3 corr, 1 pa no mesmo ponto, 2 pa em cada ponto (24). Troque de cor.</div><div class=\"row\">C3: (1 pa, 1 corr) em cada ponto (24 pa e 24 espaços).</div><div class=\"row\">C4: em cada espaço, 2 pa (48). Troque de cor.</div><div class=\"row\">C5: (1 pb, 5 corr, pule 2 pontos) em volta (16 arcos).</div><div class=\"row\">C6: em cada arco, (1 pb, 1 pma, 3 pa, 1 pma, 1 pb) (16 pétalas).</div><div class=\"row\">C7: (1 pb nas costas do pb da C5, 7 corr) em volta, por trás das pétalas (16 arcos).</div><div class=\"row\">C8: em cada arco, 9 pb.</div><p>Prenda a mandala no aro de 25 cm com pontos de pb em volta do aro, a cada 3 ou 4 pontos da última carreira. Pendure com uma fita.</p>"
            },
            {
              "id": "u-g2",
              "type": "pdf",
              "title": "Apanhador de sol",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Apanhador de sol: um pequeno aro com crochê e miçangas penduradas que refletem a luz na janela.</p><ol><li>Cubra um aro de 12 cm com pb bem juntinhos.</li><li>Faça no centro uma flor de 2 camadas (receita da presilha, na área do girador) e prenda com 6 fios de corrente até o aro.</li><li>Embaixo do aro, prenda 5 fios de linha de nylon de 20 a 30 cm.</li><li>Passe em cada fio miçangas de vidro facetadas e um cristal na ponta.</li><li>No topo, prenda uma alça de corrente para pendurar.</li></ol><div class=\"tip\"><strong>Dica:</strong> miçangas de vidro facetado refletem muito mais luz do que as de plástico.</div>"
            },
            {
              "id": "u-g3",
              "type": "pdf",
              "title": "Móbile de nuvens e estrelas",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Móbile de nuvens e estrelas para quarto de bebê ou janela.</p><h3>Nuvem</h3><div class=\"row\">Faça 3 círculos: AM com 6 pb, aum em todos (12), (1 pb, aum) ×6 (18), (2 pb, aum) ×6 (24). Una os 3 lado a lado, o do meio mais alto, com pb pelo avesso. Faça 2 nuvens e costure juntas com um pouco de fibra.</div><h3>Estrela e gota</h3><p>Use a estrela da Coleção de Natal em amarelo e gotas: AM com 6 pb, aum em todos (12), 3 carreiras retas, (1 pb, dim) até fechar, puxando a ponta.</p><h3>Montagem</h3><ol><li>Cruze 2 varetas de madeira de 30 cm, ou use um aro de 20 cm.</li><li>Pendure as peças em fios de nylon de alturas diferentes.</li><li>Equilibre o peso antes de cortar os fios definitivos.</li></ol>"
            },
            {
              "id": "u-g4",
              "type": "pdf",
              "title": "Suporte de vaso pendurado",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Suporte de vaso pendurado em crochê, para vasos de 12 a 15 cm.</p><h3>Base</h3><div class=\"row\">AM com 8 pb. Aumente 8 pontos por carreira até o círculo ter o tamanho do fundo do vaso (cerca de 48 pontos para 12 cm).</div><h3>Cordões</h3><div class=\"row\">Divida a borda em 4 partes iguais. Em cada parte, faça uma corrente de 70 corr e volte com 1 pbx em cada corrente.</div><h3>Rede</h3><div class=\"row\">A 12 cm da base, una cada cordão ao vizinho com 6 corr e pbx, formando uma rede em volta do vaso.</div><h3>Acabamento</h3><p>Junte os 4 cordões no topo, amarre numa argola de madeira e enrole fio em volta para cobrir o nó. Deixe uma franja embaixo se quiser.</p>"
            },
            {
              "id": "u-g5",

              "title": "Varal de bandeirinhas",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Varal de bandeirinhas em crochê para varanda, festa ou quarto.</p><div class=\"row\">Bandeirinha triangular: 21 corr. Carreira 1: 1 pb na 2ª corr e pb até o fim (20). Carreiras 2 a 20: vire, 1 corr, dim no começo da carreira e pb até o fim. Termine quando restar 1 ponto.</div><p>Faça 12 bandeirinhas em cores alternadas. Una pela borda reta com uma corrente de 2 m e 1 pb em cada ponto da borda de cada bandeirinha, deixando 3 corr entre elas.</p>"
