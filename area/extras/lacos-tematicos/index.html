              "url": "",
              "meta": "Leitura",
              "html": "<p>Festa infantil é a melhor vitrine para a laceira: a mãe encomenda o laço da aniversariante e ainda as lembrancinhas para as convidadas. Cada tema abaixo usa uma das 8 técnicas do seu catálogo principal.</p><div class=\"tip\"><strong>Dica:</strong> evite usar personagens de desenho com marca registrada. Trabalhe com o tema (unicórnio, sereia, bailarina) e cores, que vendem igual e não dão problema.</div><div class=\"model\"><h4>01. Unicórnio</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> lilás, rosa, azul-claro e dourado. <strong>Laço:</strong> boutique em tons pastel. <strong>Aplique:</strong> chifre e orelhinhas de feltro.</p></div><div class=\"model\"><h4>02. Princesa</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> rosa, dourado e branco. <strong>Laço:</strong> camadas. <strong>Aplique:</strong> coroa de feltro dourado.</p></div><div class=\"model\"><h4>03. Safári</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> verde-oliva, caramelo e estampa de onça. <strong>Laço:</strong> duplo. <strong>Aplique:</strong> aplique de folha.</p></div><div class=\"model\"><h4>04. Fundo do mar</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> azul, turquesa e branco. <strong>Laço:</strong> pontas longas. <strong>Aplique:</strong> estrela-do-mar de feltro.</p></div><div class=\"model\"><h4>05. Arco-íris</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> seis cores pastel. <strong>Laço:</strong> boutique arco-íris. <strong>Aplique:</strong> nuvem de feltro.</p></div><div class=\"model\"><h4>06. Borboletas</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> lilás, rosa e amarelo. <strong>Laço:</strong> chanel. <strong>Aplique:</strong> borboleta de feltro ou acrílico.</p></div><div class=\"model\"><h4>07. Jardim encantado</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> verde, rosa e lilás. <strong>Laço:</strong> camadas. <strong>Aplique:</strong> florzinhas de feltro.</p></div><div class=\"model\"><h4>08. Sereia</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> lilás, verde-água e prata. <strong>Laço:</strong> boutique com glitter. <strong>Aplique:</strong> cauda de sereia de feltro.</p></div><div class=\"model\"><h4>09. Bailarina</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> rosa claro e branco. <strong>Laço:</strong> volumoso de tule. <strong>Aplique:</strong> sapatilha de feltro.</p></div><div class=\"model\"><h4>10. Fazendinha</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> vermelho, xadrez e amarelo. <strong>Laço:</strong> cruzado. <strong>Aplique:</strong> vaquinha ou galinha de feltro.</p></div><div class=\"model\"><h4>11. Abelhinha</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> amarelo, preto e branco. <strong>Laço:</strong> duplo. <strong>Aplique:</strong> abelha de feltro.</p></div><div class=\"model\"><h4>12. Morango</h4><span class=\"tag\">Tema de festa</span><p><strong>Cores:</strong> vermelho, verde e branco com poá. <strong>Laço:</strong> chanel. <strong>Aplique:</strong> morango de feltro.</p></div>"

              "title": "Lembrancinhas em lote",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Lembrancinha de laço é o pedido em volume: de 10 a 50 peças iguais para uma mesma festa.</p><h3>Modelo que mais vende</h3><ul><li>Lacinho de bebê (técnica T6) ou chanel pequeno com fita nº 5.</li><li>Base tic-tac ou jacaré pequeno.</li><li>Cartela de papel 8 × 10 cm com o nome da aniversariante e a data.</li><li>Saquinho transparente com fita.</li></ul><h3>Produção em lote</h3><ol><li>Corte todas as tiras de uma vez, na mesma medida.</li><li>Monte todos os laços até o ponto de franzir.</li><li>Coloque todos os miolos.</li><li>Cole todas as bases.</li><li>Embale por último, conferindo um por um.</li></ol><div class=\"tip\"><strong>Dica:</strong> faça uma peça de amostra e mande foto para a mãe aprovar antes de produzir o lote inteiro.</div>"
