              "id": "u-c1",
              "type": "pdf",
              "title": "Capa de caderno de oração",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Capa para caderno de oração ou de anotações do culto. Mesma construção da capa de Bíblia, sem a faixa de zíper: é uma capa com abas, mais rápida de fazer.</p><h3>Medidas (caderno A5: 15 × 21 cm, espessura 1,5 cm)</h3><table><thead><tr><th>Peça</th><th>Medida</th></tr></thead><tbody><tr><td>Tecido de fora</td><td>2 × 15 + 1,5 + 2 + 2 = 35,5 × 25 cm</td></tr><tr><td>Forro</td><td>35,5 × 25 cm</td></tr><tr><td>Abas (2×)</td><td>12 × 25 cm, dobradas ao meio</td></tr><tr><td>Manta</td><td>33,5 × 23 cm</td></tr></tbody></table><h3>Montagem</h3><ol><li>Acolchoe o tecido de fora com a manta.</li><li>Dobre as abas ao meio e prenda nas laterais do forro, direito com direito.</li><li>Una tecido de fora e forro, deixando 8 cm abertos embaixo.</li><li>Corte os cantos, desvire, passe a ferro e feche a abertura com pesponto.</li><li>Encaixe o caderno nas abas.</li></ol><p>Para outros cadernos use a fórmula: largura = 2 × largura do caderno + espessura + 4; altura = altura do caderno + 4.</p>"
            },
            {
              "id": "u-c2",
              "type": "pdf",
              "title": "Capa de hinário",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Capa para hinário ou harpa, geralmente menor e mais grossa que a Bíblia de bolso. Use a construção com zíper da Bíblia e a fórmula dos moldes do curso principal.</p><table><thead><tr><th>Medida comum do hinário</th><th>Corpo</th><th>Faixa (4 tiras)</th><th>Zíper</th></tr></thead><tbody><tr><td>11 × 16 × 2,5 cm</td><td>28,5 × 20 cm</td><td>3,2 × 42 cm</td><td>46 cm</td></tr><tr><td>13 × 19 × 3 cm</td><td>33 × 23 cm</td><td>3,5 × 49 cm</td><td>53 cm</td></tr></tbody></table><div class=\"tip\"><strong>Dica:</strong> venda em conjunto com a capa da Bíblia na mesma estampa. O kit Bíblia + hinário sai muito para casais e presentes.</div>"
            },
            {
              "id": "u-c3",
              "type": "pdf",
              "title": "Estojo de canetas para estudo",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Estojo para canetas e marca-textos de estudo bíblico.</p><table><thead><tr><th>Peça</th><th>Medida</th></tr></thead><tbody><tr><td>Tecido de fora e forro</td><td>2 de 22 × 10 cm cada</td></tr><tr><td>Zíper</td><td>20 cm</td></tr><tr><td>Manta (opcional)</td><td>2 de 20 × 8 cm</td></tr></tbody></table><ol><li>Costure o zíper entre tecido de fora e forro, de um lado e do outro.</li><li>Abra o zíper até a metade.</li><li>Una os tecidos de fora entre si e os forros entre si, deixando 6 cm abertos no forro.</li><li>Faça cantos de 2 cm na base para o estojo ficar em pé.</li><li>Desvire, feche o forro e coloque um puxador de fita no zíper.</li></ol>"
            },

              "title": "Chaveiro porta-versículo",
              "url": "",
              "meta": "Leitura",
              "html": "<p>Chaveiro de tecido com um versículo escolhido pela cliente. Ótimo para lembrancinha de batizado, aniversário e encontro de jovens.</p><ol><li>Corte 2 retângulos de 6 × 9 cm de tecido e 1 de manta.</li><li>Na frente, aplique a referência ou o nome com vinil têxtil ou bordado.</li><li>Una com uma argolinha de fita dobrada no topo, direito com direito, deixando 3 cm abertos.</li><li>Desvire, feche com pesponto em volta e prenda a argola de chaveiro.</li></ol><div class=\"tip\"><strong>Dica:</strong> em lembrancinhas, faça lotes de 20 a 50 iguais e cobre por quantidade.</div>"

              "meta": "Leitura",
              "html": "<p>Capa de agenda ou planner com elástico para fechar. Mesma construção da capa de caderno, com um elástico de 1 cm costurado no verso.</p><ol><li>Siga as medidas da capa de caderno para o tamanho da agenda.</li><li>Antes de unir o forro, prenda um elástico redondo na lateral do verso, formando uma alça que passe pela frente.</li><li>Costure um botão de tecido na frente para prender o elástico.</li><li>Opcional: bolso interno de 10 × 14 cm em uma das abas para cartões.</li></ol>"
