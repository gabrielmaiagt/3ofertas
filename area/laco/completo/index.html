              "id": "l-passo",
              "type": "pdf",
              "title": "Passo a passo dos modelos",
              "url": "",
              "html": "<p>Todos os 80 modelos do catálogo saem destas 8 técnicas. Aprenda as técnicas primeiro; depois cada modelo é só uma questão de mudar fita, medida, cor e acabamento.</p><h3>T1 · Laço chanel (duas camadas)</h3><p><strong>Material:</strong> Fita nº 9: 1 tira de 30 cm e 1 tira de 24 cm. Miolo: 6 cm de fita nº 2.</p><ol><li>Pegue a tira de 30 cm e leve as duas pontas até o centro, sobrepondo 1 cm. Prenda com uma gota de cola.</li><li>Faça o mesmo com a tira de 24 cm.</li><li>Coloque a argola menor sobre a maior, alinhando os centros.</li><li>Franza o centro com agulha e linha, dando 3 voltas bem apertadas.</li><li>Enrole o miolo, cole atrás e fixe no bico de pato.</li></ol><h3>T2 · Laço boutique (voltas em leque)</h3><p><strong>Material:</strong> Fita nº 9: cerca de 1 m. Miolo: 6 cm de fita nº 2.</p><ol><li>Segure a ponta da fita entre o polegar e o indicador.</li><li>Faça uma volta para a direita, torça a fita meia volta no centro e faça uma volta para a esquerda.</li><li>Repita até ter 3 voltas de cada lado, cada uma um pouco menor que a anterior.</li><li>Passe agulha e linha no centro, puxe para franzir e dê voltas apertadas.</li><li>Abra as voltas com os dedos, cole o miolo e a base.</li></ol><h3>T3 · Laço cruzado (pontas em X)</h3><p><strong>Material:</strong> Fita nº 9: 1 tira de 28 cm e 1 tira de 18 cm para as pontas.</p><ol><li>Forme uma argola com a tira de 28 cm, unindo as pontas no centro.</li><li>Dobre a tira de 18 cm em V e corte as pontas em diagonal ou em V.</li><li>Coloque o V atrás da argola, cruzando as pontas.</li><li>Franza tudo junto no centro e finalize com o miolo.</li></ol><h3>T4 · Laço de pontas longas</h3><p><strong>Material:</strong> Fita nº 9: 1 tira de 40 cm. Miolo de 6 cm.</p><ol><li>Dobre a fita formando duas alças de 7 cm, deixando duas pontas de 10 a 12 cm caídas.</li><li>Prenda o centro com linha.</li><li>Corte as pontas em V e sele com o isqueiro.</li><li>Finalize com o miolo e a base.</li></ol><h3>T5 · Laço duplo (alças paralelas)</h3><p><strong>Material:</strong> Fita nº 9: 2 tiras de 26 cm. Miolo de 6 cm.</p><ol><li>Forme duas argolas iguais.</li><li>Sobreponha uma sobre a outra, deslocando 1 cm para cima.</li><li>Franza o centro juntando as duas.</li><li>Ajuste o volume afastando as alças e finalize.</li></ol><h3>T6 · Lacinho de bebê no garfo</h3><p><strong>Material:</strong> Fita nº 2 ou 3: 30 cm.</p><ol><li>Passe a fita pela frente do garfo, deixando 5 cm de ponta para trás.</li><li>Volte a fita pela frente e passe entre os dentes do meio, de trás para a frente.</li><li>Contorne o centro e passe de novo pelo meio, de frente para trás.</li><li>Dê um nó firme atrás, tire do garfo e ajuste as alças.</li><li>Corte as pontas e sele.</li></ol><h3>T7 · Laço em camadas (três tamanhos)</h3><p><strong>Material:</strong> Fita nº 9: tiras de 30, 24 e 18 cm. Miolo de 6 cm.</p><ol><li>Forme três argolas, uma de cada tamanho.</li><li>Empilhe da maior para a menor, alinhando o centro.</li><li>Franza tudo de uma vez com linha.</li><li>Abra as camadas em leque e finalize.</li></ol><h3>T8 · Laço volumoso de tule ou organza</h3><p><strong>Material:</strong> Tule ou organza de 5 cm: 1,2 m. Base: fita nº 5.</p><ol><li>Dobre o tule em zigue-zague com 8 a 10 dobras de 12 cm.</li><li>Franza o centro com linha, apertando bem.</li><li>Abra as dobras para criar volume.</li><li>Coloque por cima um laço chanel pequeno de fita nº 5 e finalize com o miolo.</li></ol><h3>Acabamento do miolo (vale para todos)</h3><ol><li>Corte 6 cm de fita fina (nº 2 ou 3).</li><li>Passe uma gota de cola no verso do centro do laço e cole uma ponta do miolo.</li><li>Enrole o miolo pela frente, bem esticado, e cole a outra ponta atrás.</li><li>Abra o bico de pato, passe uma gota de cola na parte de cima e encaixe atrás do laço.</li><li>Cubra a base do bico de pato com um pedaço de fita para dar acabamento.</li></ol><div class=\"tip\"><strong>Dica:</strong> costure o centro antes de colar o miolo. A linha segura o formato; a cola sozinha deixa o laço desmontar com o uso.</div>"

              "id": "l-b1",

              "title": "Guia da Precificação Lucrativa",
              "url": "",
              "html": "<p>Preço justo é o que paga o material, paga o seu tempo e ainda sobra lucro. Use esta conta para cada modelo.</p><h3>A fórmula</h3><p><strong>Preço = (material + mão de obra + custos fixos) × margem</strong></p><ol><li><strong>Material:</strong> some o custo de fita, miolo, base e aplicações usados naquele laço.</li><li><strong>Mão de obra:</strong> defina quanto vale a sua hora (por exemplo R$ 15) e multiplique pelo tempo de produção.</li><li><strong>Custos fixos:</strong> energia, cola, embalagem e cartão. Some por mês e divida pelo número de laços que você faz no mês.</li><li><strong>Margem:</strong> multiplique o total por 1,5 a 2 para ter lucro e espaço para promoções.</li></ol><h3>Exemplo</h3><table><thead><tr><th>Item</th><th>Valor</th></tr></thead><tbody><tr><td>Fita nº 9 (54 cm)</td><td>R$ 1,10</td></tr><tr><td>Miolo, bico de pato e cola</td><td>R$ 0,90</td></tr><tr><td>Mão de obra (12 min a R$ 15/h)</td><td>R$ 3,00</td></tr><tr><td>Custos fixos por peça</td><td>R$ 0,50</td></tr><tr><td><strong>Custo total</strong></td><td><strong>R$ 5,50</strong></td></tr><tr><td><strong>Preço com margem de 2×</strong></td><td><strong>R$ 11,00</strong></td></tr></tbody></table><div class=\"tip\"><strong>Dica:</strong> os valores são de exemplo. Refaça a conta com os preços que você paga na sua cidade e revise a cada compra de material.</div><h3>Erros que tiram o seu lucro</h3><ul><li>Cobrar só o material e esquecer o tempo.</li><li>Copiar o preço da concorrente sem saber o custo dela.</li><li>Dar desconto em todo pedido. Prefira brinde ou kit.</li><li>Não cobrar a embalagem e o frete.</li></ul>"

              "title": "Guia de Divulgação para Artesãs",
              "url": "",
              "html": "<p>Quem não vê, não compra. Estas são as ações que mais trazem encomendas para quem está começando.</p><h3>Instagram</h3><ul><li>Bio clara: o que você vende, a cidade e como encomendar (link do WhatsApp).</li><li>Poste 3 vezes por semana: um laço novo, um laço na criança (com autorização da mãe) e um bastidor da produção.</li><li>Stories todos os dias: produção, embalagem, pedido saindo e caixinha de perguntas.</li><li>Destaques fixos: Modelos, Preços, Como encomendar e Clientes.</li></ul><h3>WhatsApp</h3><ul><li>Monte um catálogo no WhatsApp Business com foto, nome e preço de cada modelo.</li><li>Use o status como vitrine: 3 a 5 fotos por dia.</li><li>Crie uma lista de transmissão com as clientes que já compraram e avise quando chegarem modelos novos.</li></ul><h3>Fora da internet</h3><ul><li>Leve um mostruário para a escola, a igreja e o trabalho.</li><li>Faça parceria com lojas de roupa infantil e fotógrafas de newborn e acompanhamento.</li><li>Coloque um cartão com o seu @ em toda entrega.</li></ul><h3>Como fotografar</h3><ul><li>Luz de janela, nunca flash.</li><li>Fundo liso e claro (cartolina branca ou lençol).</li><li>Uma foto de frente, uma de lado e uma na cabeça da criança.</li></ul>"
