es: perlas, pedrería, botones forrados, flores y figuras de fieltro.</li></ul><div class=\"tip\"><strong>Dica:</strong> sella las puntas del grosgrain y del satín pasando la flama rápido, sin tocar el listón. La punta queda sellada sin quemarse.</div>"

              "title": "Paso a paso de los modelos",
              "url": "",
              "meta": "Material",
              "html": "<p>Los 80 modelos del catálogo salen de estas 8 técnicas. Aprende primero las técnicas; después cada modelo es solo cambiar listón, medida, color y acabado.</p><h3>T1 · Moño chanel (dos capas)</h3><p><strong>Material:</strong> Listón nº 9: 1 tira de 30 cm y 1 tira de 24 cm. Centro: 6 cm de listón nº 2.</p><ol><li>Toma la tira de 30 cm y lleva las dos puntas al centro, encimando 1 cm. Fija con una gota de silicón.</li><li>Haz lo mismo con la tira de 24 cm.</li><li>Pon el aro chico sobre el grande, alineando los centros.</li><li>Frunce el centro con aguja e hilo, dando 3 vueltas bien apretadas.</li><li>Enrolla el centro, pégalo atrás y fíjalo en la pinza pico de pato.</li></ol><h3>T2 · Moño boutique (vueltas en abanico)</h3><p><strong>Material:</strong> Listón nº 9: cerca de 1 m. Centro: 6 cm de listón nº 2.</p><ol><li>Sujeta la punta del listón entre el pulgar y el índice.</li><li>Haz una vuelta hacia la derecha, gira el listón media vuelta en el centro y haz una vuelta hacia la izquierda.</li><li>Repite hasta tener 3 vueltas de cada lado, cada una un poco más chica que la anterior.</li><li>Pasa aguja e hilo por el centro, jala para fruncir y da vueltas apretadas.</li><li>Abre las vueltas con los dedos, pega el centro y la base.</li></ol><h3>T3 · Moño cruzado (puntas en X)</h3><p><strong>Material:</strong> Listón nº 9: 1 tira de 28 cm y 1 tira de 18 cm para las puntas.</p><ol><li>Forma un aro con la tira de 28 cm, uniendo las puntas en el centro.</li><li>Dobla la tira de 18 cm en V y corta las puntas en diagonal o en V.</li><li>Pon la V detrás del aro, cruzando las puntas.</li><li>Frunce todo junto en el centro y termina con el centro de listón.</li></ol><h3>T4 · Moño de colitas largas</h3><p><strong>Material:</strong> Listón nº 9: 1 tira de 40 cm. Centro de 6 cm.</p><ol><li>Dobla el listón formando dos asas de 7 cm y deja dos colitas de 10 a 12 cm colgando.</li><li>Sujeta el centro con hilo.</li><li>Corta las colitas en V y séllalas con el encendedor.</li><li>Termina con el centro y la base.</li></ol><h3>T5 · Moño doble (asas paralelas)</h3><p><strong>Material:</strong> Listón nº 9: 2 tiras de 26 cm. Centro de 6 cm.</p><ol><li>Forma dos aros iguales.</li><li>Encima uno sobre otro, recorriendo 1 cm hacia arriba.</li><li>Frunce el centro juntando los dos.</li><li>Ajusta el volumen separando las asas y termina.</li></ol><h3>T6 · Moñito de bebé en tenedor</h3><p><strong>Material:</strong> Listón nº 2 o 3: 30 cm.</p><ol><li>Pasa el listón por delante del tenedor, dejando 5 cm de punta hacia atrás.</li><li>Regresa el listón por delante y pásalo entre los dientes del centro, de atrás hacia adelante.</li><li>Rodea el centro y pásalo otra vez por en medio, de adelante hacia atrás.</li><li>Haz un nudo firme atrás, sácalo del tenedor y acomoda las asas.</li><li>Corta las puntas y séllalas.</li></ol><h3>T7 · Moño en capas (tres tamaños)</h3><p><strong>Material:</strong> Listón nº 9: tiras de 30, 24 y 18 cm. Centro de 6 cm.</p><ol><li>Forma tres aros, uno de cada tamaño.</li><li>Apílalos del más grande al más chico, alineando el centro.</li><li>Frunce todo de una vez con hilo.</li><li>Abre las capas en abanico y termina.</li></ol><h3>T8 · Moño esponjado de tul u organza</h3><p><strong>Material:</strong> Tul u organza de 5 cm: 1.2 m. Base: listón nº 5.</p><ol><li>Dobla el tul en zigzag con 8 a 10 dobleces de 12 cm.</li><li>Frunce el centro con hilo, apretando bien.</li><li>Abre los dobleces para dar volumen.</li><li>Pon encima un moño chanel chico de listón nº 5 y termina con el centro.</li></ol><h3>Acabado del centro (para todos)</h3><ol><li>Corta 6 cm de listón delgado (nº 2 o 3).</li><li>Pon una gota de silicón en el reverso del centro del moño y pega una punta del centro.</li><li>Enrolla el centro por delante, bien estirado, y pega la otra punta atrás.</li><li>Abre la pinza pico de pato, pon una gota de silicón en la parte de arriba y colócala detrás del moño.</li><li>Forra la base de la pinza con un pedazo de listón para que quede bien terminada.</li></ol><div class=\"tip\"><strong>Dica:</strong> cose el centro antes de pegar el listón del centro. El hilo mantiene la forma; el silicón solo hace que el moño se desarme con el uso.</div>"

            {
              "id": "mx-b1",
              "type": "pdf",
              "title": "Guía de precios con ganancia",
              "url": "",
              "meta": "Material",
              "html": "<p>Un precio justo paga el material, paga tu tiempo y todavía deja ganancia. Usa esta cuenta para cada modelo.</p><h3>La fórmula</h3><p><strong>Precio = (material + mano de obra + gastos fijos) × margen</strong></p><ol><li><strong>Material:</strong> suma el costo del listón, el centro, la base y las aplicaciones de ese moño.</li><li><strong>Mano de obra:</strong> define cuánto vale tu hora (por ejemplo $60 MXN) y multiplícalo por el tiempo de producción.</li><li><strong>Gastos fijos:</strong> luz, silicón, empaque y tarjeta. Súmalos por mes y divídelos entre los moños que haces al mes.</li><li><strong>Margen:</strong> multiplica el total por 1.5 a 2 para tener ganancia y espacio para promociones.</li></ol><h3>Ejemplo</h3><table><thead><tr><th>Concepto</th><th>Valor</th></tr></thead><tbody><tr><td>Listón nº 9 (54 cm)</td><td>$5 MXN</td></tr><tr><td>Centro, pinza pico de pato y silicón</td><td>$4 MXN</td></tr><tr><td>Mano de obra (12 min a $60/h)</td><td>$12 MXN</td></tr><tr><td>Gastos fijos por pieza</td><td>$2 MXN</td></tr><tr><td><strong>Costo total</strong></td><td><strong>$23 MXN</strong></td></tr><tr><td><strong>Precio con margen de 2×</strong></td><td><strong>$46 MXN</strong></td></tr></tbody></table><div class=\"tip\"><strong>Dica:</strong> los valores son de ejemplo. Rehaz la cuenta con lo que pagas en tu ciudad y revísala cada vez que compres material.</div><h3>Errores que se comen tu ganancia</h3><ul><li>Cobrar solo el material y olvidar tu tiempo.</li><li>Copiar el precio de la competencia sin saber su costo.</li><li>Dar descuento en todos los pedidos. Mejor regala un detalle o arma un kit.</li><li>No cobrar el empaque ni el envío.</li></ul>"
            },
            {
              "id": "mx-b2",
              "type": "pdf",
              "title": "Guía de difusión para artesanas",
              "url": "",
              "meta": "Material",
              "html": "<p>Lo que no se ve, no se vende. Estas son las acciones que más pedidos traen al empezar.</p><h3>Instagram y Facebook</h3><ul><li>Bio clara: qué vendes, tu ciudad y cómo pedir (link de WhatsApp).</li><li>Publica 3 veces por semana: un moño nuevo, un moño puesto (con permiso de la mamá) y el detrás de cámaras.</li><li>Historias todos los días: producción, empaque, pedido saliendo y caja de preguntas.</li><li>Destacadas fijas: Modelos, Precios, Cómo pedir y Clientas.</li><li>Publica también en Marketplace y en grupos de venta de tu colonia.</li></ul><h3>WhatsApp</h3><ul><li>Arma un catálogo en WhatsApp Business con foto, nombre y precio de cada modelo.</li><li>Usa tus estados como vitrina: 3 a 5 fotos al día.</li><li>Crea una lista de difusión con las clientas que ya compraron y avísales cuando lleguen modelos nuevos.</li></ul><h3>Fuera de internet</h3><ul><li>Lleva un muestrario a la escuela, al trabajo y a reuniones familiares.</li><li>Haz alianzas con tiendas de ropa infantil y fotógrafas de recién nacidos.</li><li>Pon una tarjeta con tu @ en cada entrega.</li></ul><h3>Cómo tomar fotos</h3><ul><li>Luz de ventana, nunca flash.</li><li>Fondo liso y claro (cartulina blanca o una sábana).</li><li>Una foto de frente, una de lado y una puesto en la niña.</li></ul>"
            },
